name: Terraform Terratest with Go

on:
  push:
    branches: feature/terraform-test
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::884360309640:role/arc-iac-oidc-github-role
        aws-region: us-east-1

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install OpenTofu
      run: |
        curl -LO https://github.com/opentofu/opentofu/releases/download/v1.6.0/tofu_1.6.0_linux_amd64.zip
        unzip -o tofu_1.6.0_linux_amd64.zip
        sudo mv tofu /usr/local/bin/
        tofu version

    - name: Initialize Go module
      run: |
        go mod init example.com/test  # Replace with your module name if needed
        go mod tidy  # Ensure dependencies are correctly downloaded

    - name: Run Go tests
      run: |
        ls    
        pwd
        go test -v ./test
